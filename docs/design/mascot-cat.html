/* Токени StayHard Design System */
:root{color-scheme:dark;--void:#050505;--deep:#0e0e0d;--line:#262624;--ash:#8d8d88;--ink:#f1f0ea;--soot:#151412;--flame:#4d6bff;--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--brand:"IBM VGA",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:16px/1.55 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
body.checker .stage{background:repeating-conic-gradient(var(--deep) 0 25%,var(--soot) 0 50%) 0 0/20px 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:12px max(4vw,16px);border-bottom:1px solid var(--line)}
.wm{font-family:var(--brand);font-size:22px;line-height:1}
.top small{font:13px var(--mono);color:var(--ash);margin-left:12px}
.tabs{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:center;padding:6px 16px;border-bottom:1px solid var(--line)}
.btn{font:14px var(--mono);min-height:44px;padding:0 4px;background:none;border:0;color:var(--ash);cursor:pointer;white-space:nowrap}
.btn::before{content:"[";margin-right:6px;color:transparent}.btn::after{content:"]";margin-left:6px;color:transparent}
.btn:hover{color:var(--ink)}
.btn[aria-pressed=true]{color:var(--ink)}
.btn[aria-pressed=true]::before,.btn[aria-pressed=true]::after,.btn.plain::before,.btn.plain::after{color:inherit}
.btn:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
.stage{flex:1;position:relative;min-height:420px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px max(4vw,16px) 14px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--ash)}
.foot code{color:var(--ink)}
body.embed{background:transparent}
body.embed .top,body.embed .tabs,body.embed .foot{display:none}
body.embed .stage{min-height:0}
</style>

  tail1:{parent:'body',pv:[590,292],poly:[[519,112],[609,112],[609,226],[517,226],[517,162]]},
  tail2:{parent:'tail1',pv:[565,126],poly:[[505,-20],[760,-20],[760,165],[606,165],[606,130],[505,130]]},
  head:{parent:'body',pv:[278,315],poly:[[40,150],[300,150],[300,430],[40,430]]},
  legA:{parent:'body',pv:[290,448],poly:[[200,430],[338,430],[338,600],[200,600]]},
  legA2:{parent:'legA',pv:[285,592],poly:[[150,585],[338,585],[338,760],[150,760]]},
  legB:{parent:'body',pv:[378,448],poly:[[332,410],[428,410],[428,600],[332,600]]},
  legB2:{parent:'legB',pv:[378,592],poly:[[332,585],[428,585],[428,760],[332,760]]},
  legC:{parent:'body',pv:[475,458],poly:[[422,425],[521,425],[521,600],[422,600]]},
  legC2:{parent:'legC',pv:[480,592],poly:[[395,585],[521,585],[521,760],[395,760]]},
  legD:{parent:'body',pv:[562,458],poly:[[515,425],[640,425],[640,600],[515,600]]},
  legD2:{parent:'legD',pv:[560,592],poly:[[515,585],[640,585],[640,760],[515,760]]},
};
const NAMES=Object.keys(PARTS);
// Верхній контур спини з референсу (x → y). Звичайна поза = спина вирівняна до лінії BACK, горб = як на референсі
const TOPC=[[250,218],[285,232],[300,232],[315,222],[330,200],[345,186],[360,173],[375,163],[390,153],[405,151],[420,150],[435,142],[450,151],[495,151],[508,156],[518,160],[522,188],[620,188],[640,205]];
const BACK=207,BELLY=456;
const topAt=x=>{for(let i=1;i<TOPC.length;i++)if(x<=TOPC[i][0]){const [a,b]=TOPC[i-1],[c,d]=TOPC[i];return b+(d-b)*clamp((x-a)/(c-a));}return 230;};
const dropAt=x=>x<255?0:BACK-topAt(x);            // на скільки зміщується спина в точці x (− = підтягується: шия)
// ---- плавність ----
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eOut=t=>1-Math.pow(1-t,3);
const eBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};   // з перельотом
const seg=(u,a,b)=>clamp((u-a)/(b-a));
const pulse=(t,period,len,off=0)=>{const u=(((t+off)%period+period)%period)/len;return u<1?Math.sin(Math.PI*u):0;};
const wob=(t,f)=>Math.sin(t*f)*.6+Math.sin(t*f*1.73+1.3)*.3+Math.sin(t*f*2.9+2.1)*.1; // «жива» хвиля без повторів
const Z=()=>{const p={flat:1,g:{dx:0,dy:0,rot:0,pv:[380,420],s:1},b:{rot:0,pv:[400,456],sy:1,sx:1},sc:{},clipGround:true};NAMES.forEach(n=>{if(n!=='body')p[n]=0;});return p;};

const ANIMS={
main:{name:'стоїть ↔ горб',sub:'стоїть; раз на 20 секунд вигинає спину горбом і повертається',pose(t){
  const per=20,u=(t%per)/per,p=Z(),br=Math.sin(t*1.8);
  // 0–.70 стоїть · .70–.77 спина піднімається · .77–.88 горб · .88–.96 спина опускається
  const up=u<.70?0:u<.77?ease(seg(u,.70,.77)):u<.88?1:u<.96?1-ease(seg(u,.88,.96)):0;
  p.flat=1-up;                                                    // рухається лише спина
  p.g.dx=2.5*wob(t,.45);p.b.sy=1+.013*br;
  const look=ease(clamp(.5+.9*wob(t,.33)));p.head=-.04+.08*look+.012*br;
  p.tail1=.06*Math.sin(t*1.1);
  p.tail2=.22*Math.sin(t*1.1-1.1)+.3*pulse(t,5.3,.45);
  return p;}},
};
// ---------- рендер ----------
const stage=document.getElementById('stage'),cv=document.createElement('canvas');stage.appendChild(cv);
const ctx=cv.getContext('2d');
const mk=k=>{const c=document.createElement('canvas');c.width=COLS*k;c.height=ROWS*k;const x=c.getContext('2d',{willReadFrequently:true});x.k=k;return [c,x];};
const [mA,xA]=mk(1),[mS,xS]=mk(3);  // кіт: 1 семпл у центрі клітинки (текстура вже усереднена по клітинці)
let W,H,dpr,CW,CH,FPX,ADV=.6,REL=null;

function calibrate(){ // відносна «чорнота» кожного гліфа шрифту — для вибору символу за щільністю
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true}),fs=60;
  x.font=`${fs}px "Geist Mono",ui-monospace,monospace`;ADV=x.measureText('M').width/fs;
  const w=Math.round(fs*ADV),h=Math.round(w*PH/PW);c.width=w;c.height=h;
  const ink=ch=>{x.clearRect(0,0,w,h);x.font=`${fs}px "Geist Mono",ui-monospace,monospace`;x.textBaseline='middle';x.fillStyle='#fff';x.fillText(ch,0,h/2);
    const d=x.getImageData(0,0,w,h).data;let s=0;for(let i=3;i<d.length;i+=4)s+=d[i];return s/(255*w*h);};
  const at=ink('@');REL=[...RAMP].map(ch=>[ch,ink(ch)/at]);
}
const GTH=[[.9,'@'],[.8,'%'],[.7,'#'],[.56,'*'],[.46,'+'],[.36,'='],[.25,'-'],[.15,':'],[.06,'.']];
const glyph=v=>{for(const [t,ch] of GTH)if(v>=t)return ch;return ' ';};

function resize(){
  const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  CW=Math.min(W/COLS,H/(ROWS*PH/PW));CH=CW*PH/PW;FPX=CW/ADV;
}
function base(x){const k=x.k;
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.fillStyle='#000';x.fillRect(0,0,COLS*k,ROWS*k);
  x.setTransform(k/PW,0,0,k/PH,-GX0*k/PW,-GY0*k/PH);
}
function rotAbout(x,pv,a,sx=1,sy=1){x.translate(pv[0],pv[1]);x.rotate(a);x.scale(sx,sy);x.translate(-pv[0],-pv[1]);}
function chain(x,n,p){const P=PARTS[n];if(P.parent)chain(x,P.parent,p);if(P.parent==='body'&&!n.startsWith('leg'))x.translate(0,p.flat*Math.max(0,dropAt(P.pv[0])));if(n!=='body')rotAbout(x,P.pv,p[n]||0,1,p.sc[n]||1);}
function drawCat(p){
  base(xA);xA.imageSmoothingEnabled=true;xA.imageSmoothingQuality='high';
  xA.save();
  if(p.clipGround){xA.beginPath();xA.rect(-400,-400,1600,GROUND+400);xA.clip();}
  xA.globalCompositeOperation='lighten';
  const g=p.g;xA.translate(g.dx,g.dy);rotAbout(xA,g.pv,g.rot,g.s,g.s);
  rotAbout(xA,p.b.pv,p.b.rot,p.b.sx||1,p.b.sy);
  const polyClip=P=>{xA.beginPath();P.poly.forEach(([a,b],i)=>i?xA.lineTo(a,b):xA.moveTo(a,b));xA.closePath();xA.clip();};
  for(const n of NAMES){
    const P=PARTS[n];
    if(n==='body'&&p.flat>0){                        // тулуб смужками: кожна стискається до лінії спини
      for(let x=250;x<660;x+=8){xA.save();xA.beginPath();xA.rect(x-4,-60,16,620);xA.clip();
        const top=topAt(x+4),k=1-p.flat*dropAt(x+4)/(BELLY-top);
        xA.translate(0,BELLY);xA.scale(1,k);xA.translate(0,-BELLY);polyClip(P);xA.drawImage(TEX,0,0,TW,TH);xA.restore();}  // контур ріжемо вже в стиснутих координатах
      xA.save();polyClip(P);xA.beginPath();xA.rect(-400,-60,650,620);xA.rect(660,-60,400,620);xA.clip();xA.drawImage(TEX,0,0,TW,TH);xA.restore();
      continue;}
    xA.save();chain(xA,n,p);polyClip(P);
    xA.drawImage(TEX,0,0,TW,TH);xA.restore();
  }
  if(p.flat>0){const v=Math.round(159*p.flat);xA.fillStyle=`rgb(${v},${v},${v})`;  // латка під підборіддям у звичайній позі
    xA.beginPath();xA.ellipse(214,401,15,8,-.25,0,7);xA.fill();}
  xA.restore();
}
function drawSaturn(s){
  base(xS);xS.save();xS.translate(s.c[0],s.c[1]);xS.rotate(s.tilt);xS.strokeStyle=xS.fillStyle='#fff';
  xS.lineWidth=8;xS.beginPath();xS.ellipse(0,0,74,19,0,Math.PI,2*Math.PI);xS.stroke();   // задня частина кільця
  xS.beginPath();xS.arc(0,0,34,0,7);xS.fill();                                              // планета
  xS.globalCompositeOperation='destination-out';xS.lineWidth=20;                             // щілина перед кільцем
  xS.beginPath();xS.ellipse(0,0,74,19,0,.15,Math.PI-.15);xS.stroke();
  xS.globalCompositeOperation='source-over';xS.lineWidth=8;
  xS.beginPath();xS.ellipse(0,0,74,19,0,0,Math.PI);xS.stroke();xS.restore();
}
function cover(x){const SS=x.k;
  const d=x.getImageData(0,0,COLS*SS,ROWS*SS).data,o=new Float32Array(COLS*ROWS),rw=COLS*SS,n=255*SS*SS;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let s=0;
    for(let j=0;j<SS;j++){let k=((r*SS+j)*rw+c*SS)*4;for(let i=0;i<SS;i++,k+=4)s+=d[k];}
    o[r*COLS+c]=s/n;}
  return o;
}
let key='main';
function frame(t){
  const ov=[],p=ANIMS[key].pose(t,ov);
  drawCat(p);const a=cover(xA);let s=null;
  if(p.saturn){drawSaturn(p.saturn);s=cover(xS);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.font=`${FPX}px "Geist Mono",ui-monospace,monospace`;ctx.textBaseline='top';
  const x0=(W-COLS*CW)/2,y0=(H-ROWS*CH)/2;
  const layer=(get,color)=>{ctx.fillStyle=color;
    for(let r=0;r<ROWS;r++){let line='',any=false;
      for(let c=0;c<COLS;c++){const g=get(r*COLS+c);line+=g;if(g!==' ')any=true;}
      if(any)ctx.fillText(line,x0,y0+r*CH);}};
  layer(i=>(s&&s[i]>.2)?' ':glyph(a[i]*1.6),COL.ink);
  if(s)layer(i=>s[i]>.2?(s[i]>.75?'@':s[i]>.5?'%':s[i]>.35?'*':'+'):' ',COL.flame);
  for(const o of ov){const c=Math.floor((o.w[0]-GX0)/PW),r=Math.floor((o.w[1]-GY0)/PH);
    if(c<0||r<0||c>=COLS||r>=ROWS)continue;
    ctx.globalAlpha=Math.max(0,o.a);ctx.fillStyle=COL[o.c];ctx.fillText(o.ch,x0+c*CW,y0+r*CH);ctx.globalAlpha=1;}
}

// ---------- інтерфейс ----------
const tabs=document.getElementById('tabs'),sub=document.getElementById('sub'),emb=document.getElementById('emb');
function select(k){key=k;for(const b of tabs.children)b.setAttribute('aria-pressed',String(b.dataset.k===k));sub.textContent=ANIMS[k].sub;emb.textContent='?embed';}
for(const k of Object.keys(ANIMS)){const b=document.createElement('button');b.className='btn';b.dataset.k=k;b.textContent=ANIMS[k].name;b.onclick=()=>select(k);tabs.appendChild(b);}
select(key);
document.getElementById('bg').onclick=e=>{const on=document.body.classList.toggle('checker');e.currentTarget.setAttribute('aria-pressed',String(on));};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
// у вставці (агент) — ~12 кадрів/с за правилом DS і пауза, коли вкладку сховано
const FRAME_MS=Q.has('embed')?83:0;let last=-1e9;
function loop(now){if(!document.hidden&&now-last>=FRAME_MS){last=now;frame(reduce?0:(now-t0)/1000);}if(!reduce)requestAnimationFrame(loop);}
Promise.all([document.fonts.ready,TEX.decode()]).then(()=>{calibrate();resize();new ResizeObserver(()=>{resize();if(reduce)frame(0);}).observe(stage);requestAnimationFrame(loop);});
window.__frame=(k,t)=>{select(k);frame(t);};
})();
</script>
</body>
</html>
