[project]
name = "flame"
version = "0.1.0"
description = "Flame in Freefall — FastAPI backend + RAG agent over NASA PSI FLEX data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flame"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/flame/ingest/psi_flex.py"]  # перенесений скрипт збору даних, стиль не чіпаємо

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
